{% extends 'base.html' %}

{% block content %}
<style>
    .page-center {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card-box {
        width: 1000px;
        max-width: 95%;
        background: white;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 30px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .card-box h2 {
        text-align: center;
        margin-bottom: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    table, th, td {
        border: 1px solid #333;
    }

    th, td {
        padding: 10px;
        text-align: center;
    }

    th {
        background-color: #007bff;
        color: white;
    }
</style>

<div class="page-center">
    <div class="card-box">
        <h2>Employee List</h2>
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Designation</th>
                <th>Basic Salary</th>
            </tr>
            {% for emp in employees %}
            <tr>
                <td>{{ emp.emp_id }}</td>
                <td>{{ emp.emp_name }}</td>
                <td>{{ emp.department }}</td>
                <td>{{ emp.designation }}</td>
                <td>{{ emp.basic_salary }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</div>
{% endblock %}
